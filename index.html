<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>豆包语音对话 - QWEN</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-main">
        <h1>豆包语音对话</h1>
        <p class="subtitle">语音输入 → 豆包识别 → QWEN 回答 → TTS 播报</p>
      </div>
      <button id="settings-toggle-btn" class="btn btn-secondary settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel">
        <span>设置</span>
      </button>
    </header>

    <section id="settings-panel" class="panel settings-panel" hidden>
      <div class="settings-grid">
        <div class="settings-section">
          <h2>大模型设置</h2>
          <label class="model-picker">
            <span>QWEN API Key</span>
            <input id="settings-qwen-api-key" type="password" autocomplete="off">
          </label>
          <label class="model-picker">
            <span>默认模型</span>
            <select id="settings-qwen-model" class="model-select">
              <option value="qwen3.6-max-preview">qwen3.6-max-preview</option>
              <option value="qwen3.6-plus">qwen3.6-plus</option>
              <option value="qwen3.6-flash">qwen3.6-flash</option>
            </select>
          </label>
        </div>

        <div class="settings-section">
          <h2>豆包设置</h2>
          <label class="model-picker">
            <span>APP ID</span>
            <input id="settings-volc-app-id" type="text" autocomplete="off">
          </label>
          <label class="model-picker">
            <span>Access Token</span>
            <input id="settings-volc-access-token" type="password" autocomplete="off">
          </label>
          <label class="model-picker">
            <span>API Key</span>
            <input id="settings-volc-api-key" type="password" autocomplete="off">
          </label>
          <label class="model-picker">
            <span>ASR Resource ID</span>
            <input id="settings-volc-resource-id" type="text" autocomplete="off">
          </label>
          <label class="model-picker">
            <span>TTS Resource ID</span>
            <input id="settings-volc-tts-resource-id" type="text" autocomplete="off">
          </label>
          <label class="model-picker">
            <span>代理地址</span>
            <input id="settings-volc-proxy-url" type="text" autocomplete="off">
          </label>
        </div>
      </div>

      <div class="settings-actions">
        <button id="settings-save-btn" class="btn btn-primary" type="button">
          <span>保存设置</span>
        </button>
        <span id="settings-status" class="settings-status"></span>
      </div>
    </section>

    <div class="controls panel">
      <label class="model-picker">
        <span>LLM 模型</span>
        <select id="model-select" class="model-select">
          <option value="qwen3.6-max-preview">qwen3.6-max-preview</option>
          <option value="qwen3.6-plus">qwen3.6-plus</option>
          <option value="qwen3.6-flash">qwen3.6-flash</option>
        </select>
      </label>
      <label class="model-picker">
        <span>豆包音色</span>
        <select id="voice-select" class="model-select">
          <option value="zh_female_vv_uranus_bigtts">温柔女声</option>
          <option value="zh_female_cancan_mars_bigtts">灿灿女声</option>
          <option value="zh_male_ahu_raphael_bigtts">阿虎男声</option>
          <option value="zh_male_qingshu_raphael_bigtts">青叔男声</option>
          <option value="zh_female_shuangkuaisisi_moon_bigtts">双快思思</option>
        </select>
      </label>
      <button id="start-btn" class="btn btn-primary">
        <span>开始录音</span>
      </button>
      <button id="stop-btn" class="btn btn-danger" disabled>
        <span>停止录音</span>
      </button>
      <button id="clear-btn" class="btn btn-secondary">
        <span>清空对话</span>
      </button>
    </div>

    <div class="chat-container panel">
      <div id="chat-messages" class="chat-messages"></div>
    </div>

    <div id="status-bar" class="status-bar panel">
      <span id="status-text">就绪</span>
      <div id="latency-text" class="latency-text"></div>
    </div>

    <div id="realtime-text" class="realtime-text panel"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
