<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>豆包语音对话</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-main">
        <div class="header-logo"></div>
        <div>
          <h1>豆包语音对话</h1>
          <p class="subtitle">语音输入 → 豆包识别 → QWEN 回答 → TTS 播报</p>
        </div>
      </div>
      <button id="settings-toggle-btn" class="settings-toggle" type="button">
        <span>设置</span>
      </button>
    </header>

    <section id="settings-panel" class="panel settings-panel" hidden>
      <div class="settings-grid">
        <div class="settings-section">
          <h2>大模型设置</h2>
          <label class="input-group">
            <span>QWEN API Key</span>
            <input id="settings-qwen-api-key" type="password" placeholder="sk-..." autocomplete="off">
          </label>
          <label class="input-group">
            <span>默认模型</span>
            <select id="settings-qwen-model">
              <option value="qwen-max">qwen-max</option>
              <option value="qwen-plus">qwen-plus</option>
              <option value="qwen-turbo">qwen-turbo</option>
            </select>
          </label>
        </div>

        <div class="settings-section">
          <h2>豆包设置</h2>
          <p class="settings-note">ASR 使用 X-Api-App-Key、X-Api-Access-Key 与 X-Api-Resource-Id；本地开发默认从 `.env.local` 读取，发布后可手动填写</p>
          <label class="input-group">
            <span>App Key</span>
            <input id="settings-volc-app-key" type="password" autocomplete="off">
          </label>
          <label class="input-group">
            <span>Access Key</span>
            <input id="settings-volc-access-key" type="password" autocomplete="off">
          </label>
          <label class="input-group">
            <span>TTS API Key</span>
            <input id="settings-volc-api-key" type="password" autocomplete="off">
          </label>
          <label class="input-group">
            <span>TTS 音色</span>
            <select id="settings-volc-tts-voice">
              <option value="zh_female_vv_uranus_bigtts">温柔女声</option>
              <option value="zh_female_cancan_mars_bigtts">灿灿女声</option>
              <option value="zh_male_ahu_raphael_bigtts">阿虎男声</option>
              <option value="zh_male_qingshu_raphael_bigtts">青叔男声</option>
              <option value="zh_female_shuangkuaisisi_moon_bigtts">双快思思</option>
            </select>
          </label>
          <label class="input-group">
            <span>录音快捷键</span>
            <input id="settings-record-shortcut" type="text" readonly placeholder="点击后按一个键">
          </label>
        </div>
      </div>

      <div class="settings-actions">
        <button id="settings-save-btn" class="btn btn-primary">
          <span>保存设置</span>
        </button>
        <button id="settings-clear-cache-btn" class="btn btn-secondary" type="button">
          <span>清除本地缓存</span>
        </button>
        <span id="settings-status" class="settings-status"></span>
      </div>
    </section>

    <div class="controls panel">
      <label class="input-group">
        <span>LLM 模型</span>
        <select id="model-select">
          <option value="qwen-max">qwen-max</option>
          <option value="qwen-plus">qwen-plus</option>
          <option value="qwen-turbo">qwen-turbo</option>
        </select>
      </label>
      <label class="input-group">
        <span>豆包音色</span>
        <select id="voice-select">
          <option value="zh_female_vv_uranus_bigtts">温柔女声</option>
          <option value="zh_female_cancan_mars_bigtts">灿灿女声</option>
          <option value="zh_male_ahu_raphael_bigtts">阿虎男声</option>
          <option value="zh_male_qingshu_raphael_bigtts">青叔男声</option>
          <option value="zh_female_shuangkuaisisi_moon_bigtts">双快思思</option>
        </select>
      </label>
      <button id="start-btn" class="btn btn-primary">
        <span>开始录音</span>
      </button>
      <button id="stop-btn" class="btn btn-danger" disabled>
        <span>停止录音</span>
      </button>
      <button id="clear-btn" class="btn btn-secondary">
        <span>清空对话</span>
      </button>
    </div>

    <div class="chat-container panel">
      <div id="chat-messages" class="chat-messages"></div>
    </div>

    <div id="status-bar" class="status-bar panel">
      <span id="status-text">就绪</span>
      <div id="latency-text" class="latency-text"></div>
    </div>

    <div id="realtime-text" class="realtime-text panel"></div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
